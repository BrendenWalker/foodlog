# Example Swarm stack using an external / in-house Postgres.
# Images publish to GHCR when a semver tag is pushed (same cadence as Pages):
#   docker pull ghcr.io/brendenwalker/foodlog-sync:latest
#   docker pull ghcr.io/brendenwalker/foodlog-sync:1.8.0
#   docker stack deploy -c docker-stack.example.yml foodlog
#
# Put Traefik/Caddy/nginx TLS in front; the PWA requires HTTPS.
# If the package is private: docker login ghcr.io

services:
  sync:
    image: ghcr.io/brendenwalker/foodlog-sync:latest
    environment:
      FOODLOG_ADDR: ":8080"
      DATABASE_URL: postgres://foodlog:SECRET@postgres:5432/foodlog?sslmode=require
      FOODLOG_SYNC_SECRET: oats-42
      FOODLOG_CORS_ORIGINS: https://brendenwalker.github.io
    networks:
      - proxy
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        # adjust to your ingress labels

networks:
  proxy:
    external: true
  internal:
    external: true
